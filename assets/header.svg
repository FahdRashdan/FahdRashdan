<text class="role" x="500" y="140" text-anchor="middle">SOFTWARE ENGINEER  |  CYBERSECURITY ENGINEER</text>
<text class="line" x="500" y="182" text-anchor="middle" style="animation-delay:0s">Frontend  |  Backend  |  Full-Stack</text>
<text class="line" x="500" y="182" text-anchor="middle" style="animation-delay:3s">Web and Mobile Applications</text>
