<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Fahd Rashdan, Full-Stack Engineer and Cybersecurity Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="55%" stop-color="#161b3a"/><stop offset="100%" stop-color="#2a1a4f"/></linearGradient>
<linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1f6feb" stop-opacity=".55"/><stop offset="100%" stop-color="#a371f7" stop-opacity=".55"/></linearGradient>
<linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a371f7" stop-opacity=".4"/><stop offset="100%" stop-color="#1f6feb" stop-opacity=".4"/></linearGradient>
<linearGradient id="w3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#58a6ff" stop-opacity=".3"/><stop offset="100%" stop-color="#a371f7" stop-opacity=".3"/></linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#b6c8ff"/></linearGradient>
<clipPath id="clip"><rect width="1000" height="260" rx="14"/></clipPath>
<style>
text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
.name{font-size:56px;font-weight:800;fill:url(#name);letter-spacing:2px}
.role{font-size:17px;fill:#9aa7c7;letter-spacing:5px}
.line{font-size:19px;fill:#58a6ff;opacity:0;animation:cycle 15s infinite}
.w1{animation:drift 14s linear infinite}
.w2{animation:drift 20s linear infinite reverse}
.w3{animation:drift 28s linear infinite}
.star{animation:tw 3s ease-in-out infinite}
.cur{animation:blink 1s steps(1) infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1000px)}}
@keyframes cycle{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:translateY(0)}17%{opacity:1;transform:translateY(0)}20%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</defs>
<g clip-path="url(#clip)">
<rect width="1000" height="260" fill="url(#bg)"/>
